<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body class="h-full bg-slate-100/50">
    <div class="flex min-h-full flex-col justify-center py-3 sm:px-6 lg:px-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-4xl"> <!-- Increased max width -->
            <div class="text-center mb-5">
                <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/image-removebg-preview-15%201-G0lGat5BJUm8O34c0iVcGQ6iTs9gtn.png" alt="Admin Logo" class="w-16 h-16 mx-auto mb-4">
                <h2 class="mt-6 text-center text-3xl font-bold text-gray-900">New Admin</h2>
            </div>
        </div>

        <div class="mt-0 sm:mx-auto sm:w-full sm:max-w-4xl">
            <div class="bg-white py-8 px-6 shadow sm:rounded-xl sm:px-10">
                <form class="space-y-6" action="/admin/add" method="post">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-10">
                        <!-- General Information -->
                        <div class="space-y-4">
                            <h3 class="text-lg font-medium text-gray-900">General Information</h3>
                            <div class="relative">
                                <label for="email" class="text-sm font-medium text-gray-700">
                                    <i class="fas fa-envelope mr-2"></i>Email address
                                </label>
                                <input id="email" name="email" type="email" autocomplete="email" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                            </div>

                            <div>
                                <label for="password" class="block text-sm font-medium text-gray-700">
                                    <i class="fas fa-lock mr-2"></i>Password
                                </label>
                                <input id="password" name="password" type="password" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                            </div>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="mt-6">
                        <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                            <i class="fas fa-user-plus mr-2"></i>Add Admin
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
