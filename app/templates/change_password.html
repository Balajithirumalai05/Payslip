<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body class="h-full flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md outline outline-1 rounded-2xl outline-gray-300 bg-slate-100/60 p-10 w-full space-y-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-4xl"> <!-- Increased max width -->
            <div class="text-center mb-5">
                <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/image-removebg-preview-15%201-G0lGat5BJUm8O34c0iVcGQ6iTs9gtn.png" alt="EmpDash Logo" class="w-16 h-16 mx-auto mb-4">
                <!-- <h1 class="text-3xl font-bold text-gray-900">Welcome to Troudz</h1> -->
                <h2 class="mt-6 text-center text-3xl font-bold text-gray-900">Change Password</h2>
            </div>
        </div>
        <div id="password-change">
        <form class="mt-8 space-y-6" action="/change-password" method="post" id="changePasswordForm">
            <input type="hidden" name="remember" value="true">
            <div class="rounded-md shadow-sm space-y-3">
                <div>
                    <label for="current_password" class="sr-only">Current Password</label>
                    <div class="relative">
                        <input id="current_password" name="current_password" type="password" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" placeholder="Current Password">
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center text-sm leading-5">
                            <i class="fas fa-lock text-gray-400"></i>
                        </div>
                    </div>
                </div>
                <div>
                    <label for="new_password" class="sr-only">New Password</label>
                    <div class="relative">
                        <input id="new_password" name="new_password" type="password" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" placeholder="New Password">
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center text-sm leading-5">
                            <i class="fas fa-key text-gray-400"></i>
                        </div>
                    </div>
                </div>
                <div>
                    <label for="confirm_password" class="sr-only">Confirm New Password</label>
                    <div class="relative">
                        <input id="confirm_password" name="confirm_password" type="password" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" placeholder="Confirm New Password">
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center text-sm leading-5">
                            <i class="fas fa-check text-gray-400"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <i class="fas fa-lock text-indigo-500 group-hover:text-indigo-400"></i>
                    </span>
                    Change Password
                </button>
            </div>
        </form>
        </div>
        {% if error %}
        <div class="mt-3 text-center text-sm text-red-600" id="error-message">
            {{ error }}
        </div>
        {% endif %}
    </div>



    <script src="/app/static/password_validation.js"></script>
</body>
</html>
