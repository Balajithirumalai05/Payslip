<!-- admin_login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Troudz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full">
        <div class="text-center mb-5">
            <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/image-removebg-preview-15%201-G0lGat5BJUm8O34c0iVcGQ6iTs9gtn.png" 
                 alt="Admin Logo" class="w-16 h-16 mx-auto mb-4">
            <h1 class="text-3xl font-bold text-gray-900">Admin Login</h1>
            <p class="text-gray-600 mt-2">Sign in to access the admin panel</p>
        </div>
        
        <form action="/admin/login" method="post" class="space-y-5">
            <div>
                <div class="relative">
                    <i class="ri-mail-line absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="email" name="email" required placeholder="Admin Email Address"
                           class="pl-10 w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-primary focus:border-2">
                </div>
            </div>
            
            <div>
                <div class="relative">
                    <i class="ri-lock-line absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="password" id="password" name="password" required placeholder="Password"
                           class="pl-10 w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-primary focus:border-2">
                </div>
            </div>
            
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input type="checkbox" id="remember-me" name="remember-me" class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-700">Remember me</label>
                </div>
                <a href="/admin/forgot-password" class="text-sm font-medium text-primary hover:text-primary-dark">Forgot password?</a>
            </div>
            
            <input type="submit" value="Sign In" class="w-full bg-blue-500 text-white py-2 px-4 rounded-lg hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-primary focus:ring-opacity-50 transition duration-200">
        </form>
        
        {% if error %}
        <p class="text-red-500 text-center mt-4">{{ error }}</p>
        {% endif %}
        
        <div class="mt-3 text-center">
            <p class="text-sm text-gray-600"><a href="/" class="font-medium text-primary hover:text-primary-dark">Employee login</a></p>
        </div>
    </div>
</body>
</html>
