<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body class="bg-gray-50">
    <div class="flex h-screen overflow-hidden p-3">
        <aside id="sidebar" class="bg-zinc-200/80 rounded-lg py-5 flex flex-col justify-between w-16 min-w-[64px]">
            <div class="flex flex-col items-center">
                <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/image-removebg-preview-15%201-G0lGat5BJUm8O34c0iVcGQ6iTs9gtn.png" class="w-12 h-12 mb-8">
                <nav class="space-y-2">
                    <a href="/admin/dashboard" class="nav-item flex items-center p-3 rounded-lg bg-gray-300 text-primary">
                        <i class="ri-home-line text-xl"></i>
                    </a>
                  
                   
                    <a href="/emp-paylist" class="nav-item flex items-center p-3 rounded-lg bg-gray-300 text-primary">
                        <i class="ri-bank-card-line text-xl"></i>
                    </a>
                 
                </nav>
            </div>
            <div class="flex flex-col items-center">
               
                <form action="/admin/logout" method="post" class="flex gap-2 flex-col justify-center items-center">
                    <button type="submit"
                        class="nav-item flex items-center p-3  rounded-lg hover:bg-gray-300 hover:text-primary transition-colors group relative">
                        <span class="nav-icon text-xl"><i class="ri-logout-box-line"></i></span>
                        <span
                            class="absolute left-12 top-1/2 transform -translate-y-1/2 bg-gray-900 text-white text-xs px-4 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity duration-200 z-10 ">Logout</span>
                    </button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="overflow-auto px-4 w-full">
            <div class="container mx-auto bg-white shadow rounded p-8">
                <h1 class="text-3xl font-bold text-primary mb-6">Leave request from employees</h1>
        <div class="container mx-auto bg-white shadow rounded p-8">
        <form action="/editpay" method="POST" class="form-container center bg-gray-100 p-6 rounded-lg">
            <label class="block text-gray-700" for="user_id">User ID:</label>
            <input type="number" id="user_id" name="user_id" value="{{ emp.id }}" readonly class="w-full p-2 border rounded"><br><br>
    
            <label class="block text-gray-700" for="basic">Basic:</label>
            <input type="number" id="basic" name="basic" value="{{ emp.basic }}" class="w-full p-2 border rounded"><br><br>
    
            <label class="block text-gray-700" for="hra">HRA:</label>
            <input type="number" id="hra" name="hra" value="{{ emp.hra }}" class="w-full p-2 border rounded"><br><br>
    
            <label class="block text-gray-700" for="other_allowance">Other Allowance:</label>
            <input type="number" id="other_allowance" name="other_allowance" value="{{ emp.other_allowance }}" class="w-full p-2 border rounded"><br><br>
    
            <label class="block text-gray-700" for="income_tax">Income Tax:</label>
            <input type="number" id="income_tax" name="income_tax" value="{{ emp.income_tax }}" class="w-full p-2 border rounded"><br><br>
    
            <label class="block text-gray-700" for="provident_fund">Provident Fund:</label>
            <input type="number" id="provident_fund" name="provident_fund" value="{{ emp.provident_fund }}" class="w-full p-2 border rounded"><br><br>
    
            <button type="submit"  class="px-6 py-2 bg-blue-900 text-white rounded-xl">Submit</button>
        </form>
        </div>
            </div></div>
    </div>
</body>
</html>
