<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div class="flex h-screen overflow-hidden p-3">
        <!-- Sidebar -->
        <aside id="sidebar" class="bg-zinc-200/80 rounded-lg py-5 relative flex flex-col justify-between w-16 min-w-[64px]">
            <div class="flex flex-col justify-center items-center">
                <div class="flex items-center gap-2 mb-8">
                    <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/image-removebg-preview-15%201-G0lGat5BJUm8O34c0iVcGQ6iTs9gtn.png" alt="Company Logo" class="w-12 h-12 flex-shrink-0">
                </div>
                <nav class="space-y-2">
                    <a href="/admin/dashboard" class="nav-item flex items-center p-3 rounded-lg hover:bg-gray-300 hover:text-primary transition-colors group relative">
                        <span class="nav-icon text-xl"><i class="ri-home-line"></i></span>
                        <span class="absolute left-12 top-1/2 transform -translate-y-1/2 bg-gray-900 text-white text-xs px-4 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity duration-200 z-10">Dashboard</span>
                    </a>

                    <a href="/emp-paylist" class="nav-item flex items-center p-3 rounded-lg hover:bg-gray-300 hover:text-primary transition-colors group relative">
                        <span class="nav-icon text-xl"><i class="ri-bank-card-line"></i></span>
                        <span class="absolute left-12 top-1/2 transform -translate-y-1/2 bg-gray-900 text-white text-xs px-4 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity duration-200 z-10">Payroll</span>
                    </a>

                    <a href="/employee/add" class="nav-item flex items-center p-3 rounded-lg hover:bg-gray-300 hover:text-primary transition-colors group relative">
                        <span class="nav-icon text-xl"><i class="ri-bank-card-line"></i></span>
                        <span class="absolute left-12 top-1/2 transform -translate-y-1/2 bg-gray-900 text-white text-xs px-4 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity duration-200 z-10">Add Employee</span>
                    </a>
                </nav>
            </div>
            <div class="flex flex-col items-center">
                <form action="/admin/logout" method="post" class="flex gap-2 flex-col justify-center items-center">
                    <button type="submit" class="nav-item flex items-center p-3 rounded-lg hover:bg-gray-300 hover:text-primary transition-colors group relative">
                        <span class="nav-icon text-xl"><i class="ri-logout-box-line"></i></span>
                        <span class="absolute left-12 top-1/2 transform -translate-y-1/2 bg-gray-900 text-white text-xs px-4 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity duration-200 z-10">Logout</span>
                    </button>
                </form>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto bg-zinc-100 p-6">
            <div class="max-w-4xl mx-auto">
                <div class="text-center mb-5">
                    <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/image-removebg-preview-15%201-G0lGat5BJUm8O34c0iVcGQ6iTs9gtn.png" alt="EmpDash Logo" class="w-16 h-16 mx-auto mb-4">
                    <h2 class="text-3xl font-bold text-gray-900">New Employee</h2>
                </div>

                <div class="bg-white py-8 px-6 shadow sm:rounded-xl sm:px-10">
                    {% if msg == "added" %}
                    <div id="success-msg" class="text-green-600 font-semibold flex items-center gap-2 mb-4">
                        <i class="ri-checkbox-circle-fill text-green-600 text-xl"></i> Employee added successfully!
                    </div>
                    {% endif %}

                    <!-- Form Starts -->
                    <form id="password-validation" class="space-y-6" action="/employee/add" method="post">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-10">
                            <!-- General Information -->
                            <div class="space-y-4">
                                <h3 class="text-lg font-medium text-gray-900">General Information</h3>

                                <div class="relative">
                                    <label for="name" class="text-sm font-medium text-gray-700">
                                        <i class="fas fa-user mr-2"></i>Name
                                    </label>
                                    <input id="name" name="name" type="text" placeholder="Name" required class="mt-1 ps-10 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 sm:text-sm">
                                </div>

                                <div>
                                    <label for="email" class="text-sm font-medium text-gray-700">
                                        <i class="fas fa-envelope mr-2"></i>Email
                                    </label>
                                    <input id="email" name="email" type="email" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 sm:text-sm">
                                </div>

                                <div>
                                    <label for="password" class="text-sm font-medium text-gray-700">
                                        <i class="fas fa-lock mr-2"></i>Password
                                    </label>
                                    <input id="password" name="password" type="password" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 sm:text-sm">
                                </div>

                                <div>
                                    <label for="role" class="text-sm font-medium text-gray-700">
                                        <i class="fas fa-briefcase mr-2"></i>Role
                                    </label>
                                    <input id="role" name="role" type="text" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 sm:text-sm">
                                </div>

                                <div>
                                    <label for="phone_number" class="text-sm font-medium text-gray-700">
                                        <i class="fas fa-phone mr-2"></i>Phone Number
                                    </label>
                                    <input id="phone_number" name="phone_number" type="text" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 sm:text-sm">
                                </div>
                            </div>

                            <!-- Personal Information -->
                            <div class="space-y-4">
                                <h3 class="text-lg font-medium text-gray-900">Personal Information</h3>

                                <div>
                                    <label for="gender" class="text-sm font-medium text-gray-700">
                                        <i class="fas fa-venus-mars mr-2"></i>Gender
                                    </label>
                                    <select name="gender" id="gender" required class="mt-1 block w-full border border-gray-300 rounded-md py-2 px-3 sm:text-sm">
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>

                                <div class="flex gap-2 items-center justify-between">
                                    <div class="w-full">
                                        <label for="date_of_birth" class="text-sm font-medium text-gray-700">
                                            <i class="fas fa-calendar-alt mr-2"></i>Date of Birth
                                        </label>
                                        <input type="date" name="date_of_birth" id="date_of_birth" required class="mt-1 block w-full border border-gray-300 rounded-md py-2 px-3 sm:text-sm">
                                    </div>
                                    <div class="w-20">
                                        <label for="age" class="text-sm font-medium text-gray-700">
                                            <i class="fas fa-birthday-cake mr-2"></i>Age
                                        </label>
                                        <input type="number" name="age" id="age" min="18" required class="mt-1 block w-full border border-gray-300 rounded-md py-2 px-3 sm:text-sm">
                                    </div>
                                </div>

                                <div>
                                    <label for="date_of_join" class="text-sm font-medium text-gray-700">
                                        <i class="fas fa-calendar-check mr-2"></i>Date of Join
                                    </label>
                                    <input type="date" name="date_of_join" id="date_of_join" required class="mt-1 block w-full border border-gray-300 rounded-md py-2 px-3 sm:text-sm">
                                </div>

                                <div>
                                    <label for="address" class="text-sm font-medium text-gray-700">
                                        <i class="fas fa-home mr-2"></i>Address
                                    </label>
                                    <textarea name="address" id="address" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md py-2 px-3 sm:text-sm"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="mt-6">
                            <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700">
                                <i class="fas fa-user-plus mr-2"></i>Add Employee
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        setTimeout(() => {
            const msgBox = document.getElementById('success-msg');
            if (msgBox) msgBox.style.display = 'none';
        }, 3000);
    </script>
</body>
</html>
